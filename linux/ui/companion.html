<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070914">
  <title>AirBridge</title>
  <link rel="icon" href="/assets/icon.svg">
  <link rel="stylesheet" href="/assets/shared.css">
  <link rel="stylesheet" href="/assets/companion.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main class="phone">
    <header class="bar">
      <div class="brand"><img src="/assets/icon.svg" alt=""><span>AirBridge</span></div>
      <div class="link-chip" id="linkChip"><span class="pulse-dot off" id="linkDot"></span><span id="linkText">Connecting…</span></div>
    </header>

    <section class="unpaired" id="unpaired" hidden>
      <div class="big-icon" id="unpairedIcon"></div>
      <h1>Scan to connect</h1>
      <p>Open <b>AirBridge</b> on your computer, click the <b>QR</b> button and scan the code with this phone's camera.</p>
    </section>

    <section class="home" id="home" hidden>
      <button class="you" id="youChip" title="Change how you appear">You appear as <b id="youName">…</b></button>

      <div class="orb-wrap">
        <div class="orb-rings"><i></i><i></i><i></i></div>
        <svg class="orb-progress" viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="92"/><circle class="bar" id="orbBar" cx="100" cy="100" r="92"/></svg>
        <button class="orb" id="orb">
          <span class="orb-icon" id="orbIcon"></span>
          <span class="orb-label" id="orbLabel">Send files</span>
          <span class="orb-sub" id="orbSub">to your computer</span>
        </button>
      </div>

      <div class="quick">
        <button class="btn ghost" id="btnPhotos"></button>
        <button class="btn ghost" id="btnText"></button>
      </div>

      <div class="recent" id="recent"></div>
    </section>
  </main>

  <input type="file" id="pickAny" multiple hidden>
  <input type="file" id="pickMedia" multiple accept="image/*,video/*" hidden>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="offerSheet" role="dialog" aria-modal="true">
    <div class="grabber"></div>
    <div class="offer">
      <div class="offer-avatar"><div class="avatar" id="offerAvatar"></div></div>
      <h2 id="offerTitle">…</h2>
      <div id="offerBody"></div>
      <div class="offer-actions" id="offerActions">
        <button class="btn ghost" id="offerDecline">Decline</button>
        <button class="btn" id="offerAccept">Accept</button>
      </div>
    </div>
  </section>

  <div class="modal" id="modal" hidden></div>
  <div class="toasts" id="toasts"></div>

  <script src="/assets/shared.js"></script>
  <script src="/assets/companion.js"></script>
</body>
</html>
