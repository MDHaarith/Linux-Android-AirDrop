[package]
name = "airbridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "AirDrop-style file and text sharing between Linux and Android (LocalSend protocol compatible)"
license = "MIT"
repository = "https://github.com/MDHaarith/Linux-Android-AirDrop"
readme = "../README.md"
keywords = ["airdrop", "localsend", "file-sharing", "android", "linux"]

[features]
default = ["tray"]
# System tray icon (StatusNotifierItem over D-Bus, no C libraries needed).
tray = ["dep:ksni"]
# Native app window (needs libwebkit2gtk-4.1-dev and libgtk-3-dev to build).
# Without it the UI opens as a Chromium app window or in the default browser.
webview = ["dep:wry", "dep:tao"]
# Drop zone on the screen edge (needs libgtk-3-dev and libgtk-layer-shell-dev).
edge = ["dep:gtk", "dep:gtk-layer-shell", "dep:pangocairo", "dep:cairo-rs"]

[dependencies]
aes = "0.8"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
cbc = { version = "0.1", features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
filetime = "0.2"
futures-util = "0.3"
hkdf = "0.12"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service", "http1", "http2"] }
if-addrs = "0.15"
# Photo previews that travel with a request (decode + small JPEG only).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
mdns-sd = "0.21"
mime_guess = "2"
nix = { version = "0.30", default-features = false, features = ["fs"] }
prost = "0.14"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
ring = "0.17"
rsa = { version = "0.9", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
x509-parser = { version = "0.18", features = ["verify"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

# PNG output is only used by the snapshot tests of the drop zone.
cairo-rs = { version = "0.18", optional = true, features = ["png"] }
gtk = { version = "0.18", optional = true }
gtk-layer-shell = { version = "0.8", optional = true, features = ["v0_5"] }
ksni = { version = "0.3", optional = true }
pangocairo = { version = "0.18", optional = true }
tao = { version = "0.34", optional = true }
wry = { version = "0.53", optional = true }

[dev-dependencies]
tempfile = "3"

# RSA key generation (once, on first start) is painfully slow without optimizations.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
codegen-units = 4

[[example]]
name = "edge_drag_source"
required-features = ["edge"]
