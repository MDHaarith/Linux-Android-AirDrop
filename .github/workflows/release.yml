name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  # Or run it from the Actions tab: it builds the chosen commit and creates the tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version, e.g. v0.1.5 (leave empty for the next patch)"
        required: false

permissions:
  contents: read

# Serialize selection through publication: two main builds cannot choose the same patch.
concurrency:
  group: airbridge-release
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    # workflow_run also fires for failed runs and pull requests. Only a successful
    # push to this repository's main branch may trigger an automatic release.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Choose the release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || (github.event_name == 'push' && github.ref_name) || '' }}
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            # Check the live tip after waiting for the release concurrency group.
            # Keep this guard here: an older checkout may predate script fixes.
            main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
            if [ "$(git rev-parse HEAD)" != "$main_sha" ]; then
              echo "::error::Refusing to release stale CI commit; run CI on the current main tip."
              exit 1
            fi
            args+=(--automatic)
          fi
          python3 .github/scripts/release_version.py select "$REQUESTED_VERSION" "${args[@]}" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Stamp app versions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 .github/scripts/release_version.py stamp "$VERSION"
      - name: System libraries (native window feature)
        timeout-minutes: 5
        run: bash .github/scripts/install-system-deps.sh libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libgtk-layer-shell-dev
      - uses: dtolnay/rust-toolchain@stable
      # Match CI's linux job id and workspace to reuse its dependency cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - name: Linux binary
        working-directory: linux
        run: |
          cargo build --release --locked --features webview,edge
          packaging/appimage.sh target/release/airbridge ..
      - uses: actions/upload-artifact@v6
        with:
          name: release-linux-x86_64
          path: airbridge-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows release
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Stamp app versions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python .github/scripts/release_version.py stamp "$env:VERSION"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - name: Windows binary
        working-directory: linux
        run: cargo build --release --locked
      - name: Check it starts without the Visual C++ runtime and has its icon
        working-directory: linux
        shell: pwsh
        run: ../.github/scripts/check_windows_exe.ps1
      - name: Installer
        working-directory: linux
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ../.github/scripts/build_windows_installer.ps1 -Version "$env:VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows-x86_64
          path: |
            linux/target/release/airbridge.exe
            linux/target/release/airbridge-setup.exe
          if-no-files-found: error

  android:
    name: Android release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Stamp app versions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 .github/scripts/release_version.py stamp "$VERSION"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Android APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AIRBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Never publish an APK signed with the runner's throwaway debug key.
          test -n "$KEYSTORE_BASE64" && test -n "$AIRBRIDGE_KEYSTORE_PASSWORD"
          export AIRBRIDGE_KEYSTORE="$RUNNER_TEMP/airbridge.p12"
          base64 -d <<< "$KEYSTORE_BASE64" > "$AIRBRIDGE_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../airbridge-android.apk
      - uses: actions/upload-artifact@v6
        with:
          name: release-android
          path: airbridge-android.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, linux, windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PUBLIC_REPO: MDHaarith/Airbridge
      ASSETS: |
        airbridge-x86_64.AppImage
        airbridge-x86_64.AppImage.sig
        airbridge-android.apk
        airbridge.exe
        airbridge.exe.sig
        airbridge-setup.exe
    steps:
      - name: Check the public release token
        env:
          TOKEN: ${{ secrets.AIRBRIDGE_RELEASE_TOKEN }}
        run: '[ -n "$TOKEN" ] || { echo "::error::AIRBRIDGE_RELEASE_TOKEN secret is missing; cannot publish to $PUBLIC_REPO"; exit 1; }'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
      - name: Check and sign release assets
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test -s airbridge-x86_64.AppImage
          chmod +x airbridge-x86_64.AppImage
          test -s airbridge-android.apk
          test -s airbridge.exe
          test -s airbridge-setup.exe
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "UPDATE_SIGNING_KEY secret is missing; refusing to publish an unsigned build"; exit 1; }
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          trap 'rm -f "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/message"' EXIT
          # The signature binds each self-updating program to its version tag.
          for asset in airbridge-x86_64.AppImage airbridge.exe; do
            { cat "$asset"; printf '\n%s' "$TAG"; } > "$RUNNER_TEMP/message"
            openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/message" -out "$asset.sig"
            test "$(stat -c %s "$asset.sig")" -eq 64
          done
      - name: Release notes
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          **Downloads**
          - \`airbridge-android.apk\`: the Android app (Android 10 or newer). Allow installs from your browser or file manager when asked. Updates itself from the app.
          - \`airbridge-setup.exe\`: the Windows installer (x64, no admin needed): Start menu and *Send to* shortcuts, optional start at sign-in, and the WebView2 runtime if missing.
          - \`airbridge.exe\`: the Windows app without installing. Run it, allow Windows Firewall access on private networks, then pair your phone by QR. Both Windows downloads update themselves from the app's Update button.
          - \`airbridge-x86_64.AppImage\`: the Linux app. Make it executable and run it (needs GTK 3 and WebKitGTK 4.1, present on most desktops). Updates itself from the app's Update button.
          - \`*.sig\`: Ed25519 signatures the in-app updater checks. You do not need them.

          See the [README](https://github.com/$PUBLIC_REPO#readme) for setup, pairing and security details.
          EOF
          echo "NOTES=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"
      # The source repository keeps the generated changelog; the public release gets the plain notes.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          prerelease: false
          make_latest: legacy
          fail_on_unmatched_files: true
          body_path: ${{ env.NOTES }}
          files: ${{ env.ASSETS }}
          generate_release_notes: true
      # The apps update from the public repository, so a release that is missing there never reaches users.
      - name: Publish to the public Airbridge repository
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.AIRBRIDGE_RELEASE_TOKEN }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          prerelease: false
          make_latest: legacy
          fail_on_unmatched_files: true
          body_path: ${{ env.NOTES }}
          files: ${{ env.ASSETS }}
