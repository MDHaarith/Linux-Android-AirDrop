name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libgtk-layer-shell-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Linux binary
        working-directory: linux
        run: |
          cargo build --release --locked --features webview,edge
          tar -C target/release -czf ../airbridge-linux-x86_64.tar.gz airbridge
      - name: Android APK
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../airbridge-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            airbridge-linux-x86_64.tar.gz
            airbridge-android.apk
          generate_release_notes: true
