name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  # Or run it from the Actions tab: it builds the chosen commit and creates the tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version, e.g. v0.1.5 (leave empty for the next patch)"
        required: false

permissions:
  contents: read

# Serialize selection through publication: two main builds cannot choose the same patch.
concurrency:
  group: airbridge-release
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    # workflow_run also fires for failed runs and pull requests. Only a successful
    # push to this repository's main branch may trigger an automatic release.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Choose the release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || (github.event_name == 'push' && github.ref_name) || '' }}
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            # Check the live tip after waiting for the release concurrency group.
            # Keep this guard here: an older checkout may predate script fixes.
            main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
            if [ "$(git rev-parse HEAD)" != "$main_sha" ]; then
              echo "::error::Refusing to release stale CI commit; run CI on the current main tip."
              exit 1
            fi
            args+=(--automatic)
          fi
          python3 .github/scripts/release_version.py select "$REQUESTED_VERSION" "${args[@]}" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Stamp app versions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 .github/scripts/release_version.py stamp "$VERSION"
      - name: System libraries (native window feature)
        timeout-minutes: 5
        run: bash .github/scripts/install-system-deps.sh libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libgtk-layer-shell-dev
      - uses: dtolnay/rust-toolchain@stable
      # Match CI's linux job id and workspace to reuse its dependency cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - name: Linux binary
        working-directory: linux
        run: |
          cargo build --release --locked --features webview,edge
          packaging/appimage.sh target/release/airbridge ..
      - uses: actions/upload-artifact@v6
        with:
          name: release-linux-x86_64
          path: airbridge-x86_64.AppImage
          if-no-files-found: error

  android:
    name: Android release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Stamp app versions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 .github/scripts/release_version.py stamp "$VERSION"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Android APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AIRBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Never publish an APK signed with the runner's throwaway debug key.
          test -n "$KEYSTORE_BASE64" && test -n "$AIRBRIDGE_KEYSTORE_PASSWORD"
          export AIRBRIDGE_KEYSTORE="$RUNNER_TEMP/airbridge.p12"
          base64 -d <<< "$KEYSTORE_BASE64" > "$AIRBRIDGE_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../airbridge-android.apk
      - uses: actions/upload-artifact@v6
        with:
          name: release-android
          path: airbridge-android.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, linux, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
      - name: Check and sign release assets
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test -s airbridge-x86_64.AppImage
          chmod +x airbridge-x86_64.AppImage
          test -s airbridge-android.apk
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "UPDATE_SIGNING_KEY secret is missing; refusing to publish an unsigned build"; exit 1; }
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          trap 'rm -f "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/message"' EXIT
          # The signature binds the AppImage to its version tag.
          { cat airbridge-x86_64.AppImage; printf '\n%s' "$TAG"; } > "$RUNNER_TEMP/message"
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/message" -out airbridge-x86_64.AppImage.sig
          test "$(stat -c %s airbridge-x86_64.AppImage.sig)" -eq 64
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          prerelease: false
          make_latest: legacy
          fail_on_unmatched_files: true
          body: |
            **Downloads**
            - `airbridge-android.apk`: the Android app (Android 10 or newer). Allow installs from your browser or file manager when asked.
            - `airbridge-x86_64.AppImage`: the Linux app. Make it executable and run it (needs GTK 3 and WebKitGTK 4.1, present on most desktops). Updates itself from the app's Update button.

            The APK is signed with a debug key made for this build, not a private release key, so a newer release may need the old app uninstalled first. See [SECURITY.md](https://github.com/${{ github.repository }}/blob/${{ needs.prepare.outputs.tag }}/docs/SECURITY.md).
          files: |
            airbridge-x86_64.AppImage
            airbridge-x86_64.AppImage.sig
            airbridge-android.apk
          generate_release_notes: true
