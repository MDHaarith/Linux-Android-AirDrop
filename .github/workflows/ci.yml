name: CI

on:
  # main still builds on every push: Release runs after CI there.
  push:
    branches: [main]
  pull_request:
    # `edited`: adding "Closes #n" lines to the description re-checks the gate.
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request is only tested (and, with the main-branch rule, only merged)
  # once it closes at least 10 issues ("Closes #n" in its description).
  issue-gate:
    name: Closes 10+ issues
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Count the issues this pull request closes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MIN: 10
        run: |
          count=$(gh api graphql -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$PR" -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) { closingIssuesReferences { totalCount } }
              }
            }' --jq '.data.repository.pullRequest.closingIssuesReferences.totalCount')
          echo "This pull request closes $count issue(s); $MIN are needed."
          if [ "$count" -lt "$MIN" ]; then
            echo "::error::Link at least $MIN issues with \"Closes #n\" in the description (found $count). Tests run once it does."
            exit 1
          fi

  linux:
    name: Linux app (Rust)
    needs: issue-gate
    # Also runs on pushes to main, where the gate is skipped.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v5
      - name: System libraries (native window feature)
        timeout-minutes: 5
        run: bash ../.github/scripts/install-system-deps.sh libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libgtk-layer-shell-dev dbus
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - name: Release version tests
        run: python3 -m unittest discover -s ../.github/scripts -p 'test_*.py'
      - run: cargo fmt --check
      - name: UI TypeScript compiles and matches the committed JavaScript
        working-directory: linux/ui
        run: npm ci --no-audit --no-fund && npm run build && git diff --exit-code -- '*.js'
      - run: node tools/test-desktop-drop.js
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --locked --features webview,edge -- -D warnings
      - run: cargo test --locked
      # The drop zone's pure logic and its offscreen renders (snapshots are uploaded).
      - run: "cargo test --locked --features edge edge::"
      - run: cargo build --release --locked --features webview,edge
      - run: packaging/appimage.sh target/release/airbridge
      - uses: actions/upload-artifact@v6
        with:
          name: edge-snapshots
          path: linux/target/edge-snapshots
      - uses: actions/upload-artifact@v6
        with:
          name: airbridge-linux-x86_64
          path: linux/airbridge-x86_64.AppImage

  windows:
    name: Windows app (Rust)
    needs: issue-gate
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - run: cargo build --release --locked
      - run: ../.github/scripts/check_windows_exe.ps1
        shell: pwsh
      - run: ../.github/scripts/build_windows_installer.ps1
        shell: pwsh
      - run: cargo test --locked
      - uses: actions/upload-artifact@v6
        with:
          name: airbridge-windows-x86_64
          path: |
            linux/target/release/airbridge.exe
            linux/target/release/airbridge-setup.exe
          if-no-files-found: error

  android:
    name: Android app + interop with Linux
    needs: issue-gate
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - name: System libraries (interop test)
        timeout-minutes: 5
        run: bash .github/scripts/install-system-deps.sh libwayland-dev
      - name: Build the Linux binary for the interop test
        run: cargo build --locked
        working-directory: linux
      - name: Unit, interop and screenshot tests
        working-directory: android
        env:
          AIRBRIDGE_LINUX_BIN: ${{ github.workspace }}/linux/target/debug/airbridge
        run: ./gradlew --no-daemon testDebugUnitTest verifyPaparazziDebug
      - name: Build APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v6
        with:
          name: airbridge-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-reports
          path: |
            android/app/build/reports
            android/app/build/linux-interop.log
